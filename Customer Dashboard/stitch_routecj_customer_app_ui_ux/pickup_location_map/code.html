<div class="flex justify-between items-center text-label-md text-on-surface-variant">

<span class="font-bold text-primary">Pickup Location</span>
</div>
<div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 25%;"></div>
</div>
</div>
<!-- Main Content Area -->
<div class="px-edge_margin flex flex-col gap-lg pb-32">
<!-- Hero Question -->
<div class="pt-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Where should we collect the package?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Confirm your current location or drop a pin.</p>
</div>
<!-- Location Card -->
<div class="bg-surface-container-low rounded-xl p-md flex flex-col gap-md relative overflow-hidden group">
<!-- Subtle glow effect -->
<div class="absolute -top-10 -right-10 w-24 h-24 bg-primary/10 rounded-full blur-2xl"></div>
<div class="flex items-start gap-sm relative z-10">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">my_location</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-lg text-label-lg text-on-surface truncate">123 Main St</p>
<p class="font-body-md text-body-md text-on-surface-variant truncate">Springfield, IL 62701</p>
</div>
<button aria-label="Refresh Location" class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center shrink-0 text-on-surface transition-transform active:scale-95">
<span class="material-symbols-outlined">refresh</span>
</button>
</div>
<!-- Fake Data Points -->
<div class="flex gap-sm pt-xs relative z-10">
<span class="bg-surface-variant px-sm py-xs rounded-full font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> Est. pickup: 10 mins
                </span>
<span class="bg-surface-variant px-sm py-xs rounded-full font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">local_shipping</span> 5 drivers near
                </span>
</div>
</div>
<!-- Map Container Placeholder -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<p class="font-label-lg text-label-lg text-on-surface">Adjust Map</p>
<p class="font-body-md text-body-md text-on-surface-variant text-right italic text-sm">Drag to move pin</p>
</div>
<div class="relative w-full h-72 rounded-xl overflow-hidden bg-surface-container shadow-md">

<div class="absolute inset-0 bg-cover bg-center" data-location="Springfield, Illinois" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD4jx_X6jggbC0sA6XzdhMP0if6SZcqdv7izxmRSmyk1i3R8oYrygYU4-LZzt4fjzRfsPcRlh_g5yNKKzf_Msm7upSqsapvVcfV_bMmsu_pGTMDfO3Zt5UcOifnkImVZs673edvhy2on4XM38Lb0iH8076FUetc1RHxUY0WyCHRIQS6_z6jXVXiWabM4PqYcRyy0xDfGQXxd2aYrS6xvU69S0OQU_8ipF-PR0fQ9ZdJGhsieoQTBnf6'); opacity: 0.8; filter: grayscale(20%) contrast(1.1);"></div>

                             Move to adjust
                         </div>
</div>
</div>

<button class="w-10 h-10 rounded-full bg-surface text-on-surface shadow-md flex items-center justify-center transition-transform active:scale-95">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface text-on-surface shadow-md flex items-center justify-center transition-transform active:scale-95">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
</div>
<button class="absolute bottom-4 left-4 w-10 h-10 rounded-full bg-primary text-on-primary shadow-md flex items-center justify-center transition-transform active:scale-95 z-20">
<span class="material-symbols-outlined text-[20px]">my_location</span>
</button>
</div>
</div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-surface/95 backdrop-blur-xl border-t border-surface-variant p-edge_margin pb-safe z-40">
<button class="w-full h-14 bg-primary text-on-primary font-title-lg text-title-lg rounded-xl flex items-center justify-center gap-sm transition-transform active:scale-[0.98] shadow-lg shadow-primary/20">
            Continue to Destination
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const mapContainer = document.getElementById('map-pin-container');
            const pin = document.getElementById('map-pin');
            const tooltip = document.getElementById('pin-tooltip');

            // Simulate drag interaction
            mapContainer.addEventListener('mousedown', () => startDrag());
            mapContainer.addEventListener('touchstart', () => startDrag());
            
            window.addEventListener('mouseup', () => endDrag());
            window.addEventListener('touchend', () => endDrag());

            function startDrag() {
                pin.classList.add('-translate-y-10', 'scale-110');
                pin.classList.remove('-translate-y-6');
                tooltip.classList.remove('opacity-0');
                tooltip.classList.add('opacity-100');
            }

            function endDrag() {
                pin.classList.remove('-translate-y-10', 'scale-110');
                pin.classList.add('-translate-y-6');
                tooltip.classList.add('opacity-0');
                tooltip.classList.remove('opacity-100');
                
                // Add a subtle drop animation
                pin.animate([
                    { transform: 'translateY(-24px)' },
                    { transform: 'translateY(-18px)' },
                    { transform: 'translateY(-24px)' }
                ], {
                    duration: 300,
                    easing: 'ease-out'
                });
            }
        });
    </script>
