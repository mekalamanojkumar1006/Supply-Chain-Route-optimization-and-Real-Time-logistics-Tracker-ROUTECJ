<!-- Header: Delivery Slot -->
<div class="px-edge_margin py-md">
<h2 class="font-title-lg text-title-lg text-on-surface">Delivery Slot</h2>
</div>
<!-- Calendar: Horizontal Scroll -->
<div class="w-full overflow-x-auto no-scrollbar pl-edge_margin pb-sm">
<div class="flex gap-sm pr-edge_margin">
<!-- Day 1 (Past) -->
<button class="flex flex-col items-center justify-center min-w-[64px] h-[72px] rounded-xl bg-surface-container-low opacity-50 cursor-not-allowed">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Mon</span>
<span class="font-title-lg text-title-lg text-on-surface">12</span>
</button>
<!-- Day 2 (Today - Active) -->
<button class="flex flex-col items-center justify-center min-w-[64px] h-[72px] rounded-xl bg-primary-container relative">
<span class="font-label-md text-label-md text-on-primary-container uppercase">Tue</span>
<span class="font-title-lg text-title-lg text-on-primary-container">13</span>
<div class="absolute -bottom-1 w-1.5 h-1.5 rounded-full bg-primary-container"></div>
</button>
<!-- Day 3 -->
<button class="flex flex-col items-center justify-center min-w-[64px] h-[72px] rounded-xl bg-surface-container shadow-sm hover:bg-surface-container-high transition-colors">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Wed</span>
<span class="font-title-lg text-title-lg text-on-surface">14</span>
</button>
<!-- Day 4 -->
<button class="flex flex-col items-center justify-center min-w-[64px] h-[72px] rounded-xl bg-surface-container shadow-sm hover:bg-surface-container-high transition-colors">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Thu</span>
<span class="font-title-lg text-title-lg text-on-surface">15</span>
</button>
<!-- Day 5 -->
<button class="flex flex-col items-center justify-center min-w-[64px] h-[72px] rounded-xl bg-surface-container shadow-sm hover:bg-surface-container-high transition-colors">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Fri</span>
<span class="font-title-lg text-title-lg text-on-surface">16</span>
</button>
</div>
</div>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<!-- Time Slots Grid -->
<div class="px-edge_margin pt-md pb-lg">
<div class="grid grid-cols-2 gap-sm">
<!-- Slot 1 -->
<button class="flex items-center justify-center py-md px-sm rounded-xl bg-surface-container shadow-sm hover:bg-surface-container-high transition-colors">
<span class="font-label-lg text-label-lg text-on-surface">9:00 AM - 10:00 AM</span>
</button>
<!-- Slot 2 (Selected) -->
<button class="flex items-center justify-center py-md px-sm rounded-xl bg-primary-container relative overflow-hidden transition-all duration-300 transform scale-[1.02] shadow-md">
<div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent pointer-events-none"></div>
<span class="font-label-lg text-label-lg text-on-primary-container relative z-10 flex items-center gap-xs">
                    11:00 AM - 12:00 PM
                    <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</span>
</button>
<!-- Slot 3 -->
<button class="flex items-center justify-center py-md px-sm rounded-xl bg-surface-container shadow-sm hover:bg-surface-container-high transition-colors">
<span class="font-label-lg text-label-lg text-on-surface">1:00 PM - 2:00 PM</span>
</button>
<!-- Slot 4 -->
<button class="flex items-center justify-center py-md px-sm rounded-xl bg-surface-container shadow-sm hover:bg-surface-container-high transition-colors">
<span class="font-label-lg text-label-lg text-on-surface">3:00 PM - 4:00 PM</span>
</button>
</div>
</div>
<!-- Header: Delivery Instructions -->
<div class="px-edge_margin pt-lg pb-md">
<h2 class="font-title-lg text-title-lg text-on-surface flex items-center gap-sm">
            Delivery Instructions
            <span class="font-label-md text-label-md text-on-surface-variant bg-surface-container-high px-2 py-1 rounded-full">Optional</span>
</h2>
</div>
<!-- Text Field Container -->
<div class="px-edge_margin pb-xl flex-1">
<div class="relative bg-surface-container-low rounded-2xl p-sm shadow-sm transition-all focus-within:shadow-md focus-within:bg-surface-container">
<textarea class="w-full bg-transparent border-none outline-none resize-none font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant min-h-[140px] p-sm" id="instruction-input" maxlength="250" placeholder="e.g. Handle with care, call before pickup, ring the bell upon arrival..."></textarea>
<div class="absolute bottom-md right-md flex items-center gap-2">
<!-- Character Counter -->
<span class="font-label-md text-label-md text-on-surface-variant" id="char-counter">
                    0/250
                </span>
</div>
<!-- Decorative Icon -->
<div class="absolute bottom-md left-md pointer-events-none opacity-20">
<span class="material-symbols-outlined text-[24px] text-on-surface">edit_note</span>
</div>
</div>
</div>
<!-- Pinned CTA at Bottom -->
<div class="px-edge_margin py-md bg-surface mt-auto shadow-[0_-4px_16px_rgba(0,0,0,0.1)]">
<button class="w-full h-14 bg-primary-container rounded-xl flex items-center justify-center gap-sm shadow-md active:scale-[0.98] transition-transform group">
<span class="font-label-lg text-label-lg text-on-primary-container">Continue</span>
<span class="material-symbols-outlined text-on-primary-container group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('instruction-input');
            const counter = document.getElementById('char-counter');
            
            if (input && counter) {
                input.addEventListener('input', (e) => {
                    const currentLength = e.target.value.length;
                    counter.textContent = `${currentLength}/250`;
                    
                    // Add a subtle color change when approaching limit
                    if (currentLength > 225) {
                        counter.classList.remove('text-on-surface-variant');
                        counter.classList.add('text-error');
                    } else {
                        counter.classList.remove('text-error');
                        counter.classList.add('text-on-surface-variant');
                    }
                });
            }
        });
    </script>
